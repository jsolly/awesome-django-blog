name: CI
run-name: >-
  ${{ (github.event_name != 'pull_request' ||
  (github.event.action != 'labeled' && github.event.pull_request.user.login != 'dependabot[bot]') ||
  (github.event.action == 'labeled' &&
   github.event.label.name == format('deps:ci:{0}', github.event.pull_request.head.sha))) && format('{0} validation', github.workflow) || 'Deferred validation' }}

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

concurrency:
  group: >-
    ${{ (github.event_name != 'pull_request' ||
    (github.event.action != 'labeled' && github.event.pull_request.user.login != 'dependabot[bot]') ||
    (github.event.action == 'labeled' &&
     github.event.label.name == format('deps:ci:{0}', github.event.pull_request.head.sha))) && format('ci-{0}-{1}-{2}', github.workflow, github.event.pull_request.number || github.ref, github.event_name) || format('deferred-{0}', github.run_id) }}
  cancel-in-progress: true

permissions:
  actions: read
  pull-requests: read
  contents: read

jobs:
  ci:
    name: >-
      ${{ (github.event_name != 'pull_request' ||
      (github.event.action != 'labeled' && github.event.pull_request.user.login != 'dependabot[bot]') ||
      (github.event.action == 'labeled' &&
       github.event.label.name == format('deps:ci:{0}', github.event.pull_request.head.sha))) && 'ci' || 'ci-deferred' }}
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action != 'labeled' && github.event.pull_request.user.login != 'dependabot[bot]') ||
      (github.event.action == 'labeled' &&
       github.event.label.name == format('deps:ci:{0}', github.event.pull_request.head.sha))
    runs-on: ubuntu-latest
    # Mirror the pre-push gate's test-only Django settings (.git-hooks/pre-push).
    env:
      DEBUG: "False"
      LOGGING: "False"
      DJANGO_SETTINGS_MODULE: app.settings
      USE_SQLITE: "True"
      USE_CLOUD: "False"
      SECURE_SSL_REDIRECT: "False"
      SECRET_KEY: "Not applicable for tests"
      ALLOWED_HOSTS: "127.0.0.1 localhost"
      SITE_ID: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Check for a validated PR tree
        id: verified-tree
        timeout-minutes: 1
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-verified-tree.sh
      - uses: actions/setup-node@v7
        if: steps.verified-tree.outputs.run_full != 'false'
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        if: steps.verified-tree.outputs.run_full != 'false'
      - run: npm run check:actions
        if: steps.verified-tree.outputs.run_full != 'false'
      - uses: actions/setup-python@v7
        if: steps.verified-tree.outputs.run_full != 'false'
        with:
          python-version-file: .python-version
          cache: pip
      - name: Install dependencies
        if: steps.verified-tree.outputs.run_full != 'false'
        run: pip install -r requirements.txt
      - name: yaml lint
        if: steps.verified-tree.outputs.run_full != 'false'
        run: yamllint -s .
      - name: ruff lint
        if: steps.verified-tree.outputs.run_full != 'false'
        run: ruff check --config ./config/pyproject.toml app
      - name: collectstatic
        if: steps.verified-tree.outputs.run_full != 'false'
        run: python manage.py collectstatic --noinput
      - name: migrate
        if: steps.verified-tree.outputs.run_full != 'false'
        run: python manage.py migrate --noinput
      - name: pytest + coverage
        if: steps.verified-tree.outputs.run_full != 'false'
        run: coverage run --rcfile=config/.coveragerc -m pytest tests
      - name: coverage report
        if: steps.verified-tree.outputs.run_full != 'false'
        run: coverage report -m --skip-covered --rcfile=config/.coveragerc
      - name: Record validated PR tree
        if: >-
          success() && github.event_name == 'pull_request' &&
          steps.verified-tree.outputs.tree != ''
        uses: actions/upload-artifact@v7
        with:
          name: ci-tree-v1-${{ github.job }}-${{ steps.verified-tree.outputs.tree }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-tree-${{ github.job }}.txt
          if-no-files-found: error
          retention-days: 7
